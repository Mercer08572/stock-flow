securityDefinitions:
  APIAppCredentials:
    description: 外部系统认证。除本请求头外还必须提供 X-Stock-Flow-Secret，密钥仅在签发时明文返回一次。
    in: header
    name: X-Stock-Flow-App-ID
    type: apiKey
  AdminSession:
    description: 管理员会话 Cookie，由 POST /auth/admin/login 下发，HttpOnly 且不可通过 JS 读取。
    in: cookie
    name: stock_flow_admin_session
    type: apiKey
